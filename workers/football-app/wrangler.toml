# Front door for the web client: serves the built assets and proxies /api/*
# to the API Worker over a service binding, so the browser sees one origin.
#
# Layout of ./site, which CI assembles — it is not committed:
#
#   site/index.html        redirect to /football/ (from ./site-root)
#   site/football/*        the built client (from apps/web/dist)
#
# The /football/ prefix is deliberate. The client is built with vite
# `base: '/football/'`, and the PWA manifest declares start_url and scope as
# /football/. Keeping the prefix means bookmarks and iPhone home-screen
# shortcuts carried over from the old GitHub Pages URL still map 1:1.
#
# No not_found_handling: the client uses hash routes (#/wager), which never
# reach the server, so there is nothing to fall back for.
name = "football-app"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./site"
# Bound so the script can serve assets explicitly for anything that is not
# /api/*. Requests that match an asset are served before the script runs.
binding = "ASSETS"

# Worker-to-Worker call inside Cloudflare's network — no public hop, no DNS,
# no per-request TLS. Replaces the build-time VITE_API_BASE the client used to
# need, which silently produced a broken deploy whenever it was unset.
[[services]]
binding = "API"
service = "fc26-worker"
