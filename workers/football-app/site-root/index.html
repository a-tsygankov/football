<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FC 26 Team Picker</title>
    <!--
      The app lives under /football/ on this origin so that bookmarks carried
      over from the old GitHub Pages URL keep working unchanged. Anyone landing
      on the bare origin gets sent there.
    -->
    <meta http-equiv="refresh" content="0; url=/football/" />
    <link rel="canonical" href="/football/" />
    <script>
      // Fires before the meta refresh in practice, and replace() keeps the
      // bare origin out of history so Back does not bounce.
      window.location.replace('/football/' + window.location.search + window.location.hash)
    </script>
    <style>
      body {
        font-family: ui-serif, Georgia, serif;
        background: #ecfdf5;
        color: #052e16;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/football/">FC 26 Team Picker</a>…</p>
  </body>
</html>
