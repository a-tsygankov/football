name: Deploy FC26 TeamPicker

on:
  # Gate pull requests on the same `ci` job that guards main. Without this,
  # nothing verified a branch until *after* it merged, so a red build only
  # surfaced once it had already blocked the deploy on main.
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'worker/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'workers/**'
      - 'redirect-page/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'worker/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'workers/**'
      - 'redirect-page/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# ── Deploy targets ────────────────────────────────────────────────
#   apps/web        → Cloudflare Workers static assets (workers/football-app)
#   redirect-page/  → GitHub Pages, redirecting the old origin 1:1
#   worker/         → Cloudflare Workers (+ D1 + R2, bindings in wrangler.toml)
#
# The monorepo uses pnpm workspaces, so we install once per job and run
# workspace-wide `typecheck` / `test:run` through the `ci` job before
# either deploy fires.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per ref. A single shared "pages" group was fine when only main
  # pushes ran, but with PRs in the mix it would make concurrent PR checks
  # cancel one another. Re-pushing to the same PR still supersedes its own
  # in-flight run, which is what we want.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  # ── Lint, typecheck, and test the whole workspace once ──
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Test (all packages)
        run: pnpm -r test:run

  # ── Build the client and deploy it to Cloudflare Workers ──
  #
  # Replaces the old GitHub Pages deploy so the client sits on the same
  # platform as the API. Mirrors the sibling tarot repo's move (PR #27):
  # a Worker with an [assets] directory rather than Cloudflare Pages.
  deploy-client:
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately no VITE_API_BASE. The client Worker now proxies /api/* to
      # the API Worker over a service binding, so the client is same-origin and
      # an empty API base is correct rather than broken. The guard that used to
      # sit here — failing the build when the variable was unset — is gone with
      # the variable it protected.
      - name: Build web (vite)
        run: pnpm --filter @fc26/web run build
        env:
          GIT_SHA: ${{ github.sha }}

      # The client is built with base '/football/' and its PWA manifest
      # declares that scope, so it is served under the same prefix here.
      # Bookmarks and home-screen shortcuts then map 1:1 to the new origin
      # and no client code has to change.
      - name: Stage site
        run: |
          mkdir -p workers/football-app/site/football
          cp -r apps/web/dist/. workers/football-app/site/football/
          cp workers/football-app/site-root/index.html workers/football-app/site/index.html

      - name: Deploy client worker (wrangler)
        working-directory: workers/football-app
        # Pinned to the version the worker package already uses, so CI cannot
        # drift onto an untested wrangler.
        run: npx --yes wrangler@3.114.17 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Publish the redirect page to the old GitHub Pages origin ──
  #
  # Keeps existing links alive: the page maps pathname, query and hash 1:1
  # onto the new origin, which uses the same /football/ prefix.
  deploy-redirect:
    runs-on: ubuntu-latest
    needs: deploy-client
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render redirect page
        env:
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
        run: |
          mkdir -p build/redirect
          # Defaults to the account's workers.dev origin, derived from the
          # worker name in workers/football-app/wrangler.toml and the same
          # tarotoracle subdomain the API worker uses
          # (fc26-worker.tarotoracle.workers.dev). Set the CLIENT_ORIGIN repo
          # variable to override, e.g. once a custom domain exists.
          origin="${CLIENT_ORIGIN:-https://football-app.tarotoracle.workers.dev}"
          # Trailing slashes would produce a double slash once the pathname is
          # appended, so normalise.
          origin="${origin%/}"
          echo "Redirecting old origin to: $origin"
          sed "s|__CLIENT_ORIGIN__|${origin}|g" redirect-page/index.html > build/redirect/index.html
          # GitHub Pages serves 404.html for unmatched paths, so deep links
          # redirect too instead of hitting Pages' default error page.
          cp build/redirect/index.html build/redirect/404.html
          if grep -q "__CLIENT_ORIGIN__" build/redirect/index.html; then
            echo "::error::placeholder survived substitution"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Deploy worker/ to Cloudflare Workers ──
  deploy-worker:
    runs-on: ubuntu-latest
    needs: ci
    # Skip when the Cloudflare token is missing (e.g. forks, first-time
    # checkout). Once the secret is configured in repo settings this
    # short-circuit becomes a no-op.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm --filter @fc26/worker run typecheck

      # D1 migrations are additive-only (see handoff §21) and this runs BEFORE
      # the worker deploy, so a new table exists by the time code depending on
      # it goes live.
      #
      # This step used to be gated on a RUN_D1_MIGRATIONS repo variable, added
      # so first-time deploys wouldn't fail before the D1 binding existed. The
      # binding has long since been provisioned, but the variable was never
      # set — so the step silently skipped on every deploy and no migration
      # ever reached production. That is exactly how 0006_bets.sql shipped its
      # code without its table and broke room login with
      # "D1_ERROR: no such table: bets".
      #
      # No gate now: `migrations apply` is idempotent (it applies only what is
      # pending), so running it unconditionally is safe and the schema can no
      # longer drift behind a deploy without the build failing loudly.
      #
      # Requires CLOUDFLARE_API_TOKEN to carry Account -> D1 -> Edit, and
      # CLOUDFLARE_ACCOUNT_ID to name the account that owns the `fc26`
      # database. Deploying a Worker needs neither, so a token scoped only for
      # Workers passes every other step and fails here with
      # "[code: 7403] The given account is not valid or is not authorized to
      # access this service" — which reads like an outage but is a token scope
      # or account-id problem. Check `wrangler whoami` and `wrangler d1 list`.
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply fc26 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker (wrangler)
        working-directory: worker
        # GIT_SHA is baked into the /api/version response so clients can
        # cross-check build identity. WORKER_VERSION stays as the semver in
        # wrangler.toml so the three-axis version check (§20) has a stable
        # floor to compare MIN_CLIENT_VERSION against.
        run: pnpm exec wrangler deploy --var "GIT_SHA:${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
