name: Chip ledger health check

# Read-only. Folds every room's chip ledger out of production D1 and fails if
# one does not add up.
#
# The fold is `roomChipLedger` — the same function the app uses, called by
# `scripts/ledger-report.ts`. That sharing is the point. This check used to
# reimplement the fold in SQL and drifted twice in a single day: once when game
# nights stopped granting chips, once when settlement landed. Each time it
# reported something untrue about production while looking perfectly healthy,
# because nothing made a second copy fail when the first one moved.
#
# It also *fails* now rather than only printing. The previous version emitted
# numbers into a log nobody was reading, so a broken invariant would have
# scrolled past unnoticed — a check that cannot fail is a check in name only.
#
# Manual only: nothing here should run on a push, and it takes no input, so it
# cannot be turned into an arbitrary-SQL console.

on:
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  ledger-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Four result sets, in the order the script expects. Only the event types
      # the ledger folds are fetched — the rest of the log is large and none of
      # it moves a chip.
      - name: Read the ledger
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute fc26 --remote --json --command "
            SELECT id, name FROM rooms;
            SELECT id, room_id, event_type, payload, occurred_at FROM game_events
             WHERE event_type IN ('chips_purchased','chips_settled','game_recorded','game_voided');
            SELECT id, room_id, name FROM gamers;
            SELECT room_id, gamer_id, stake FROM bets;
          " > "$RUNNER_TEMP/ledger.json"

      # Exits non-zero if any room's wagering fails to cancel, a settlement
      # credited somebody without debiting anyone, a night is still granting
      # chips, or a ledger row names a gamer the roster does not have.
      - name: Check it adds up
        run: pnpm exec tsx scripts/ledger-report.ts < "$RUNNER_TEMP/ledger.json"
