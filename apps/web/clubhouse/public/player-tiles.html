<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Player card studio · Clubhouse Pro</title><link rel="stylesheet" href="/side-colors.css"><link rel="stylesheet" href="/player-tiles.css"></head>
<body><main>
<header class="mast"><a href="/">Clubhouse Pro ↗</a><p>Game creation</p><h1>Player card studio</h1></header>
<section class="controls" aria-label="Customize cards">
  <div role="tablist" aria-label="Control to customize" id="tabs"></div>
  <div role="tabpanel" id="choices"></div>
  <div class="combination"><span id="summary"></span><button id="copy" type="button">Copy combination link</button></div>
  <input id="share" aria-label="Combination link" readonly hidden>
</section>
<section aria-label="Sample roster"><div class="heading"><div><p>Sample room</p><h2>Players</h2></div><button id="add">＋ Add gamer</button></div>
<div id="list"></div><button id="drawer" aria-controls="inactive"></button><div id="inactive"></div>
<div class="feedback"><span id="notice" role="status"></span><button id="undo" hidden>Undo</button></div></section>
</main><dialog aria-labelledby="title"><form><h2 id="title"></h2><label>Player name<input id="field" required maxlength="40"></label><div class="actions"><button>Save</button><button type="button" id="cancel">Cancel</button></div></form></dialog>
<script type="module" src="/player-tiles.js"></script></body></html>
