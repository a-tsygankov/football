name = "fc26-worker"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Local dev server: listen on every interface so phones on the same Wi-Fi
# can reach the Worker at http://<LAN-IP>:8787. Only affects `wrangler dev`,
# never production.
[dev]
ip = "0.0.0.0"
port = 8787

# Set via wrangler secret put / env:
# - SCHEMA_VERSION (number, matches latest applied migration)
# - MIN_CLIENT_VERSION (semver string)
# - GIT_SHA (build metadata)
[vars]
WORKER_VERSION = "0.1.18"
SCHEMA_VERSION = "14"
MIN_CLIENT_VERSION = "0.1.0"

# SESSION_SECRET is deliberately NOT here. It used to sit in [vars] as
# "fc26-local-dev-session-secret", and [vars] deploy as plaintext — from a
# public repo — so production was signing room session cookies with a value
# anyone could read, i.e. forgeable sessions.
#
# It cannot simply be shadowed by a Worker secret either: Cloudflare rejects a
# secret whose name collides with an existing var binding
# ("Binding name 'SESSION_SECRET' already in use [code: 10053]"). The var has
# to be gone from the deployed Worker first.
#
#   production:  npx wrangler secret put SESSION_SECRET
#   local dev:   worker/.dev.vars (gitignored) — see .dev.vars.example

# Phase 1 bindings. The Worker boots without these (falls back to in-memory
# stores in src/dependencies.ts so the scaffold stays runnable), but the
# /api/squads/* routes need both DB and SQUADS to serve real data.
#
# To provision:
#   wrangler d1 create fc26                       # paste database_id below
#   wrangler r2 bucket create fc26
#   pnpm exec wrangler d1 migrations apply fc26 --local
#
[[d1_databases]]
binding = "DB"
database_name = "fc26"
# The real provisioned Cloudflare D1 UUID (not a placeholder — the stale
# "replace me" note that used to sit here is what justified gating the
# migration step in CI, long after the binding was live).
database_id = "b0e1922f-6b23-4a37-b125-a71aee4ee8b2"
preview_database_id = "fc26-local-phase-2"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "SQUADS"
bucket_name = "fc26"
#
# Squad sync + logo retrieval config lives in src/config/squad.ts.
# [triggers]
# crons = ["0 6 * * *"]
